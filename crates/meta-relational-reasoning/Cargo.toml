[package]
name = "meta-relational-reasoning"
description = "Public facade for the Meta-Relational Reasoning contract graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native-inference"]
native-inference = ["mrr-deduction/native-inference", "mrr-search/native-inference"]
agentic-ai-context = ["dep:mrr-agentic-ai-context"]
agentic-ai-context-tokens = ["agentic-ai-context", "mrr-agentic-ai-context/token-layout"]

[dependencies]
mrr-agentic-ai-context = { workspace = true, optional = true, default-features = false }
ciborium.workspace = true
ed25519-dalek = "=2.2.0"
mrr-bundle.workspace = true
mrr-deduction.workspace = true
mrr-identity.workspace = true
mrr-intent.workspace = true
mrr-lineage.workspace = true
mrr-logic.workspace = true
mrr-query.workspace = true
mrr-relation.workspace = true
mrr-revision.workspace = true
mrr-search.workspace = true
mrr-transition.workspace = true
sha2.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
criterion.workspace = true
mrr-asp-rust-build-support.workspace = true
[[bench]]
name = "facade_perf"
harness = false

[lints]
workspace = true

[[example]]
name = "context_workflow"
required-features = ["agentic-ai-context-tokens"]

[[example]]
name = "context_scale"
required-features = ["agentic-ai-context-tokens"]

[[test]]
name = "context_workflow"
path = "tests/integration_test.rs"
required-features = ["agentic-ai-context-tokens"]

[[example]]
name = "context_refinement"
required-features = ["agentic-ai-context-tokens"]

[[test]]
name = "finite-transformations"
path = "tests/integration/finite_transformations.rs"
