[package]
name = "mrr-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend-neutral POO Search factor reasoning over Ascent and MRR lineage"

[features]
default = ["native-inference"]
native-inference = ["dep:mrr-gerbil", "mrr-gerbil/embedded-runtime"]
worker-inference = ["dep:mrr-gerbil"]

[dependencies]
