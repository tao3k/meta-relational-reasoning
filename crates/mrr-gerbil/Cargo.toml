[package]
name = "mrr-gerbil"
description = "Build-time Gerbil native projections and provenance admission for MRR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["embedded-runtime"]
embedded-runtime = []

[dependencies]
blake3.workspace = true
gerbil-scheme-sys.workspace = true
mrr-bundle.workspace = true
mrr-identity.workspace = true
mrr-logic.workspace = true
mrr-query.workspace = true
mrr-relation.workspace = true
rowan.workspace = true
sha2.workspace = true

[build-dependencies]
mrr-gerbil-native-build.workspace = true

[dev-dependencies]
mrr-asp-rust-build-support.workspace = true
criterion.workspace = true


[[bin]]
name = "mrr-native-worker"
path = "src/bin/mrr-native-worker.rs"
required-features = ["embedded-runtime"]

[[bench]]
name = "grammar_projection_perf"
harness = false
required-features = ["embedded-runtime"]

[lints.rust]
unsafe_code = "deny"

[[test]]
name = "temporal_runtime"
path = "tests/integration/temporal_runtime.rs"
required-features = ["embedded-runtime"]

[[test]]
name = "native_worker"
path = "tests/integration/native_worker.rs"
required-features = ["embedded-runtime"]

[[test]]
name = "worker_client"
path = "tests/integration/worker_client.rs"
