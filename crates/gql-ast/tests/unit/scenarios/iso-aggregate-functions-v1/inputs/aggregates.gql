MATCH (n) RETURN COUNT(*) AS rows, COUNT(DISTINCT n) AS distinct_nodes, AVG(ALL n.score) AS average_score, MAX(n.score) AS maximum_score, MIN(n.score) AS minimum_score, SUM(n.score) AS total_score, COLLECT_LIST(n.score) AS scores, STDDEV_SAMP(n.score) AS sample_deviation, STDDEV_POP(n.score) AS population_deviation, PERCENTILE_CONT(DISTINCT n.score, 0.5) AS continuous_median, PERCENTILE_DISC(ALL n.score, 1) AS discrete_maximum
