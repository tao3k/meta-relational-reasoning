CREATE GRAPH TYPE analytics.types AS { NODE TYPE Sample { active BOOLEAN NOT NULL, name STRING(1, 80), payload BYTES(0, 4096), amount DECIMAL(10, 2), observed ZONED DATETIME, bounded LIST<STRING NOT NULL>[16] NOT NULL, postfix INT64 ARRAY[8], profile RECORD { display STRING, rank TYPED UINT32 NOT NULL }, choice ANY VALUE<STRING | INT64>, graph_ref ANY PROPERTY GRAPH NOT NULL, table_ref TABLE { key STRING, ordinal UINT64 }, node_ref ANY NODE, edge_ref ANY EDGE, route PATH NOT NULL } }
