[package]
name = "gql-syntax"
description = "Lossless syntax foundation for ISO GQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["parser"]
parser = ["dep:gql-source", "dep:rowan"]

[dependencies]
gql-source = { workspace = true, optional = true }
icu_properties.workspace = true
rowan = { workspace = true, optional = true }
[dev-dependencies]
criterion.workspace = true
[build-dependencies]
mrr-asp-rust-project-policy.workspace = true

[lints]
workspace = true

[[bench]]
name = "syntax_perf"
harness = false
