    notes: "The central workspace policy parses the repository ledger and rejects schema drift, duplicate or missing feature ownership, invalid statuses, missing fixture fields, missing positive evidence, missing validation evidence, completed features without negative fixtures, invalid profile-module references, and incomplete quality capability evidence."
