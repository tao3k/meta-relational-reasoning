schema_version: 2
normative_reference: ISO/IEC 39075:2024
oracles:
  grafeo:
    role: syntax_feature_coverage
    normative: false
    status: non_normative_differential_oracle
  frogql:
    role: elaboration_and_path_semantics
    normative: false
    status: non_normative_differential_oracle

iso_features:
  - feature_id: gql-identifiers
    iso_feature: Identifiers
    normative_reference: ISO/IEC 39075:2024
    syntax_status: implemented
    ast_status: implemented
    sema_status: implemented
    ir_status: implemented
    positives:
      - "MATCH (node) RETURN node"
      - "MATCH (node)-[:CALLS]->(target) RETURN node"
    negatives:
      - "MATCH (a)-[:CALLS]->(1) RETURN a"
    extension_or_divergence: "Identifier validation is limited to the supported lexical and binding contexts."
    notes: "Identifiers remain Rowan tokens and lower to named bindings without source-span reparsing."
    validation: "gql-syntax parser tests and the node-only vertical slice"

  - feature_id: gql-node-patterns
    iso_feature: NodePatterns
    normative_reference: ISO/IEC 39075:2024
    syntax_status: implemented
    ast_status: implemented
    sema_status: implemented
    ir_status: implemented
    positives:
      - "MATCH (n) RETURN n"
      - "MATCH (a:Person) RETURN a"
    negatives:
      - "MATCH (a:->Person) RETURN a"
    extension_or_divergence: "Only the supported node pattern grammar is implemented."
    notes: "Node patterns are first-class graph IR elements and do not require an edge."
    validation: "gql-sema node-only match test and gql compiler vertical test"

  - feature_id: gql-edge-patterns
    iso_feature: EdgePatterns
    normative_reference: ISO/IEC 39075:2024
    syntax_status: implemented
    ast_status: implemented
    sema_status: implemented
    ir_status: implemented
    positives:
      - "MATCH (a)-[:CALLS]->(b) RETURN b"
      - "MATCH (a)<-[:CALLS]-(b) RETURN a"
    negatives:
      - "MATCH (a)-[:CALLS:Person->(b) RETURN a"
    extension_or_divergence: "Quantified and multi-hop path features are outside this slice."
    notes: "Edges are graph pattern elements with labels and explicit canonical direction."
    validation: "gql-ast direction tests and gql graph-filter vertical test"

  - feature_id: gql-edge-direction
    iso_feature: EdgeDirection
    normative_reference: ISO/IEC 39075:2024
    syntax_status: implemented
    ast_status: implemented
    sema_status: implemented
    ir_status: implemented
    positives:
      - "MATCH (a)-[:CALLS]->(b) RETURN b"
      - "MATCH (a)<-[:CALLS]-(b) RETURN a"
    negatives:
      - "MATCH (a)-[:CALLS](b) RETURN a"
    extension_or_divergence: "Only simple outgoing, incoming, and undirected forms are mapped."
    notes: "Direction is derived from typed Rowan token neighbors, never from a source substring."
    validation: "gql-ast outgoing and incoming direction tests"

  - feature_id: gql-labels-and-types
    iso_feature: LabelsAndTypes
    normative_reference: ISO/IEC 39075:2024
    syntax_status: implemented
    ast_status: implemented
    sema_status: implemented
    ir_status: implemented
    positives:
      - "MATCH (a:Person)-[:CALLS]->(b:Server) RETURN a"
      - "MATCH (a)-[:CALLS:Type]->(b) RETURN a"
    negatives:
      - "MATCH (a:Person)-[:CALLS:Person->(b) RETURN a"
    extension_or_divergence: "Catalog-driven type checking is not part of this frontend slice."
    notes: "Labels are preserved as graph pattern data; catalog declarations remain a separate ISO boundary."
    validation: "gql-ast labeled edge test and graph IR construction"

  - feature_id: gql-match
    iso_feature: MATCH
    normative_reference: ISO/IEC 39075:2024
    syntax_status: implemented
    ast_status: implemented
    sema_status: implemented
    ir_status: implemented
    positives:
      - "MATCH (n) RETURN n"
      - "MATCH (a)-[:CALLS]->(b) WHERE a = 1 RETURN b"
    negatives:
      - "MATCH (a)-[:CALLS]->(b) RETURN"
      - "MATCH (a)<-[:CALLS]-((b) RETURN a"
    extension_or_divergence: "OPTIONAL, quantified, and subquery forms are outside this release."
    notes: "MATCH lowers to a graph pattern without relation-provider admission."
    validation: "gql compiler node-only and graph-filter vertical tests"

  - feature_id: gql-where
    iso_feature: WHERE
    normative_reference: ISO/IEC 39075:2024
    syntax_status: implemented
    ast_status: implemented
    sema_status: implemented
    ir_status: implemented
    positives:
      - "MATCH (a)-[:CALLS]->(b) WHERE a = 1 RETURN b"
      - "MATCH (a)-[:CALLS]->(b) WHERE NOT (a != 1) RETURN b"
    negatives:
      - "MATCH (a)-[:CALLS]->(b) WHERE"
      - "MATCH (a)-[:CALLS]->(b) WHERE missing = 1 RETURN b"
    extension_or_divergence: "Expression typing is limited to the implemented scalar and binding forms."
    notes: "WHERE lowers to graph-semantic filter expressions with one precedence implementation."
    validation: "gql-sema filter lowering and gql compiler graph-filter vertical test"

  - feature_id: gql-let
    iso_feature: LET
    normative_reference: ISO/IEC 39075:2024
    syntax_status: implemented
    ast_status: implemented
    sema_status: implemented
    ir_status: implemented
    positives:
      - "LET a = 1"
      - "LET a = 1 WHERE a"
    negatives:
      - "LET = 1"
    extension_or_divergence: "Multiple assignment and advanced value expressions are outside this release."
    notes: "LET bindings are explicit graph query IR bindings and participate in scope checking."
    validation: "gql-sema LET binding test"

  - feature_id: gql-return
    iso_feature: RETURN
    normative_reference: ISO/IEC 39075:2024
    syntax_status: implemented
    ast_status: implemented
    sema_status: implemented
    ir_status: implemented
    positives:
      - "RETURN a"
      - "MATCH (a) RETURN a"
    negatives:
      - "MATCH (a) RETURN"
    extension_or_divergence: "Aggregation, aliases, and ordering are outside this release."
    notes: "RETURN lowers to explicit graph query projections."
    validation: "gql-sema projection test and gql compiler vertical tests"

quality_capabilities:
  - capability_id: lossless-rowan-roundtrip
    status: implemented
    positives:
      - ""
      - "   \n\t  "
      - "# comment only\n"
      - "MATCH (a) RETURN a\n"
    negatives: []
    notes: "One Rowan green tree preserves every source byte, including trivia and trailing newlines."
    validation: "gql-syntax parser library and fixture tests"

  - capability_id: malformed-delimiter-recovery
    status: implemented
    positives:
      - "MATCH (a)-[:CALLS:Person->(b) RETURN a"
      - "MATCH (a)<-[:CALLS]-((b) RETURN a"
    negatives: []
    notes: "Recovery emits diagnostics while retaining a lossless Rowan tree."
    validation: "gql-syntax parser fixture recovery tests"

  - capability_id: unknown-token-recovery
    status: implemented
    positives:
      - "MATCH (a) /x @"
      - "MATCH (a) ## comment"
    negatives: []
    notes: "Unknown characters and comments remain represented in the lexical and Rowan views."
    validation: "gql-syntax unknown-token test"

  - capability_id: unterminated-literal-recovery
    status: implemented
    positives:
      - "'unterminated"
    negatives:
      - "'closed'"
    notes: "Unterminated literals produce diagnostics without discarding source bytes."
    validation: "gql-syntax unterminated string test"
