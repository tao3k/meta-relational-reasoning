    notes: "Every parser input is parsed twice under panic capture and must round-trip exactly through Rowan with deterministic, ordered, in-bounds diagnostics. Additional deterministic ASCII corpora run twice through typed AST lowering and the complete compiler pipeline, requiring panic freedom, diagnostic determinism, source preservation, and in-bounds diagnostic spans."
    validation: "gql-syntax generated_inputs_never_panic_or_lose_source_bytes; gql-ast generated_inputs_never_panic_during_typed_ast_lowering; gql-compiler generated_inputs_never_panic_in_the_complete_compiler_pipeline"

