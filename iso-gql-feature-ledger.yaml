schema_version: 5
configuration:
  model: modular_iso_conformance
  selected_profile: gql-query-language-frontend-v1
  module_key: module_id
  feature_registry_key: feature_id
  extension_policy:
    new_standard_release: "Add a standard_releases entry and compose modules explicitly."
    new_supplement: "Add a release supplement entry and only the affected modules."
    new_feature: "Add one feature_registry entry and reference it from exactly one module."
    profile_change: "Require an explicit profile change; never widen a profile implicitly."

standard_releases:
  - release_id: iso-39075-2024
    normative_reference: ISO/IEC 39075:2024
    kind: published_edition
    status: published_edition_to_be_revised
    publication: 2024-04
    supplements:
      - release_id: iso-39075-2024-cor-1
        normative_reference: ISO/IEC 39075:2024/Cor 1:2026
        kind: technical_corrigendum_under_publication
        status: under_publication_pending_clause_adjudication
        stage: "60.00"
        publication: 2026-07
        applies_to: iso-39075-2024
        implementation_policy: "Track as a versioned correction to the 2024 baseline. Do not mark any feature corrected until the licensed corrigendum clause and executable evidence are recorded."
        adjudication:
          status: pending_clause_text
          public_metadata_source: "https://www.iso.org/standard/93701.html"
          public_metadata_verified: 2026-08-13
          evidence_gap: "The public ISO product page confirms publication and applicability but exposes no correction clauses; the OBP requires an interactive JavaScript session."
          required_evidence: "Licensed corrigendum clause text, mapped feature identifiers, positive and negative fixtures, and layer-specific executable evidence."
    successor:
      release_id: iso-39075-edition-2-cd
      normative_reference: ISO/IEC CD 39075
      status: under_development

modules:
  - module_id: language-foundation
    kind: iso_standard_module
    feature_ids:
      - gql-lexical-identifiers
      - gql-lexical-literals
      - gql-trivia-and-comments
      - gql-values-and-types
  - module_id: graph-model
    kind: iso_standard_module
    feature_ids:
      - gql-property-graph-model
      - gql-catalog-and-schema-model
      - gql-node-patterns
      - gql-edge-patterns
  - module_id: path-patterns
    kind: iso_standard_module
    feature_ids:
      - gql-path-patterns
      - gql-quantified-paths
  - module_id: query-core
    kind: iso_standard_module
    feature_ids:
      - gql-match
      - gql-optional-match
      - gql-where
      - gql-let
      - gql-return
      - gql-query-composition
      - gql-expression-language
      - gql-property-and-label-expressions
  - module_id: query-advanced
    kind: iso_standard_module
    feature_ids:
      - gql-grouping-aggregation-ordering
  - module_id: data-management
    kind: iso_standard_module
    feature_ids:
      - gql-graph-modification
      - gql-catalog-management
      - gql-procedures-and-call
      - gql-session-and-control

profiles:
  - profile_id: gql-query-language-frontend-v1
    release_id: iso-39075-2024
    claim: independent_gql_compatible_query_language_frontend
    included_modules:
      - language-foundation
      - graph-model
      - query-core
    deferred_modules:
      - path-patterns
      - query-advanced
      - data-management
    rule: "Implement source, lossless CST, typed AST, semantic/HIR analysis, and backend-neutral canonical IR. This profile excludes storage, transaction execution, backend runtime behavior, and ISO certification. Partial features remain partial until licensed clause adjudication permits a conformance claim."
  - profile_id: gql-iso-audit-v1
    release_id: iso-39075-2024
    claim: audit_inventory_only
    included_modules:
      - language-foundation
      - graph-model
      - path-patterns
      - query-core
      - query-advanced
      - data-management
    deferred_modules: []
    rule: "This profile measures the full audited surface and makes no conformance claim."

audit:
  standard: ISO/IEC 39075:2024
  edition: 1
  publication: 2024-04
  official_status: published_edition_to_be_revised
  implementation_claim: "Independent GQL-compatible query-language frontend. No ISO certification or full ISO conformance claim. Storage, transaction execution, and backend runtime behavior are outside the selected profile."
  normative_anchor_policy: "Use the licensed standard for clause-level verification. Do not invent clause numbers from public summaries."
  audit_scope: "Language surface, graph model, query semantics, catalog boundary, and implementation evidence in this repository."
  known_follow_up:
    - "ISO/IEC CD 39075, Edition 2"
  tracked_corrections:
    - "ISO/IEC 39075:2024/Cor 1:2026 (under publication at stage 60.00; clause adjudication pending licensed text)"

status_vocabulary:
  implemented: "The repository has syntax, typed lowering, semantic validation, canonical IR, and positive and negative evidence for the declared profile."
  partial: "A narrow subset is implemented; the feature must not be represented as complete ISO support."
  not_implemented: "The feature is part of the audited standard surface but is not implemented in this repository."
  not_applicable: "The feature does not have a representation in this pipeline layer."

feature_registry:
  - feature_id: gql-lexical-identifiers
    priority: 10
    dependencies: []
    clause_evidence_status: pending_licensed_clause
    iso_feature: Lexical_identifiers
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: not_applicable
    positive_fixtures:
      - "MATCH (node) RETURN node"
      - "MATCH (source_node) RETURN source_node"
    negative_fixtures:
      - "MATCH (a)-[:CALLS]->(1) RETURN a"
    scope_note: "The lexer preserves identifier tokens and the frontend resolves simple bindings; the complete standard identifier and reserved-word space is not claimed."
    validation: "gql-syntax parser tests and node-only vertical contract"

  - feature_id: gql-lexical-literals
    priority: 20
    dependencies: []
    clause_evidence_status: pending_licensed_clause
    iso_feature: Lexical_literals
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: not_applicable
    positive_fixtures:
      - "LET count = 1"
      - "MATCH (n) WHERE n = 'x' RETURN n"
    negative_fixtures:
      - "'unterminated"
      - "MATCH (n) WHERE n = 1.2.3 RETURN n"
    scope_note: "Integer, string, boolean, and null literal lowering exist; the complete GQL scalar, temporal, collection, and numeric literal families are not implemented."
    validation: "gql-syntax literal recovery tests and gql-sema expression tests"

  - feature_id: gql-trivia-and-comments
    priority: 30
    dependencies: []
    clause_evidence_status: pending_licensed_clause
    iso_feature: Lexical_trivia_and_comments
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: not_applicable
    sema_status: not_applicable
    ir_status: not_applicable
    catalog_status: not_applicable
    positive_fixtures:
      - "# comment only\n"
      - "MATCH  (n) RETURN n\n"
    negative_fixtures: []
    scope_note: "Trivia is losslessly retained by Rowan; this is a frontend quality capability and does not imply complete lexical conformance."
    validation: "gql-syntax lossless Rowan tests"

  - feature_id: gql-values-and-types
    priority: 40
    dependencies: [gql-lexical-literals]
    clause_evidence_status: pending_licensed_clause
    iso_feature: GQL_values_and_type_system
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: partial
    positive_fixtures:
      - "MATCH (n) RETURN TRUE"
      - "MATCH (n) RETURN NULL"
      - "MATCH (n) RETURN [1, 2, [3]]"
      - "MATCH (n) LET values = [1, 2] RETURN values[0]"
      - "MATCH (n) RETURN 1 IN [1, 2]"
    negative_fixtures:
      - "MATCH (n) RETURN [1, 2, missing]"
    scope_note: "Scalar and list values, integer collection subscripts, and list membership are represented; element type inference/coercion, bounds semantics, additional collection predicates, and the complete GQL value domain remain deferred."
    validation: "gql-syntax list/subscript/membership structure, gql-ast collection lowering, gql-sema collection IR, and facade vertical contracts"

  - feature_id: gql-property-graph-model
    priority: 50
    dependencies: [gql-lexical-identifiers, gql-values-and-types]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Property_graph_data_model
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: partial
    positive_fixtures:
      - "MATCH (n:Person) RETURN n"
      - "MATCH (a)-[:CALLS]->(b) RETURN a"
    negative_fixtures:
      - "MATCH (a)-[:CALLS]->(b) RETURN a.missing"
    scope_note: "Node and edge pattern shapes plus ordered source-level property constraints are represented through the frontend and canonical IR. Persistent graph property values, element identity, graph values, mutation/storage behavior, and complete property-graph semantics are not implemented."
    validation: "gql-ast graph pattern tests, facade node/edge property-constraint contracts, and gql-catalog type declarations"

  - feature_id: gql-catalog-and-schema-model
    priority: 60
    dependencies: [gql-property-graph-model]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Catalog_schema_graph_and_type_declarations
    normative_reference: ISO/IEC 39075:2024
    syntax_status: not_implemented
    ast_status: partial
    sema_status: partial
    ir_status: not_applicable
    catalog_status: partial
    positive_fixtures:
      - "Catalog graph and schema declarations are constructed through the Rust API"
    negative_fixtures:
      - "MATCH (n:MissingType) RETURN n"
    scope_note: "The Rust catalog API contains ISO-named graph, schema, node-type, edge-type, property, and procedure declarations; GQL catalog/schema statements and full validation are absent."
    validation: "gql-catalog API construction tests"

  - feature_id: gql-node-patterns
    priority: 70
    dependencies: [gql-lexical-identifiers, gql-property-graph-model]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Node_patterns
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: partial
    positive_fixtures:
      - "MATCH (n) RETURN n"
      - "MATCH (n:Person) RETURN n"
      - "MATCH (n:Person {name: 'Ada', age: 42}) RETURN n"
    negative_fixtures:
      - "MATCH (n:Person RETURN n"
      - "MATCH (n {id: 1, id: 2}) RETURN n"
    scope_note: "Node bindings, label lists, and ordered property constraints are represented through lossless CST, typed AST spans, duplicate-key validation, and backend-neutral graph IR. Label expressions, catalog-driven property typing, element identity semantics, and the complete node-pattern grammar remain absent."
    validation: "gql syntax, AST, sema, and facade node-pattern property vertical contracts"

  - feature_id: gql-edge-patterns
    priority: 80
    dependencies: [gql-node-patterns]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Edge_patterns_and_labels
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: partial
    positive_fixtures:
      - "MATCH (a)-[:CALLS]->(b) RETURN b"
      - "MATCH (a)<-[:CALLS]-(b) RETURN a"
      - "MATCH (a)-[e:KNOWS {since: 2020, weight: 3}]->(b) RETURN e"
    negative_fixtures:
      - "MATCH (a)-[:CALLS]->(b RETURN b"
      - "MATCH (a)-[e:KNOWS {since: 2020, since: 2021}]->(b) RETURN e"
    scope_note: "Directed edge bindings, label lists, and ordered property constraints are represented through lossless CST, typed AST spans, duplicate-key validation, and backend-neutral graph IR. Label expressions, catalog-driven property typing, endpoint constraints, element identity semantics, and the complete edge-pattern grammar remain absent."
    validation: "gql-ast direction/label tests and facade edge-pattern property vertical contracts"

  - feature_id: gql-path-patterns
    priority: 90
    dependencies: [gql-node-patterns, gql-edge-patterns]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Path_patterns
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: not_applicable
    positive_fixtures:
      - "MATCH p = (a)-[:CALLS]->(b) RETURN p"
      - "MATCH (a)-[:CALLS]->(b)-[:CALLS]->(c) RETURN c"
    negative_fixtures:
      - "MATCH p = (a)-[:CALLS]->(b) RETURN shortestPath(p)"
    scope_note: "Named path binding over a simple graph-pattern sequence is represented end to end; quantified paths, path modes, and shortest-path expressions remain outside this slice."
    validation: "Parser, AST, sema, and IR named-path vertical contract"

  - feature_id: gql-quantified-paths
    priority: 100
    dependencies: [gql-path-patterns]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Quantified_and_restricted_paths
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: not_applicable
    positive_fixtures:
      - "MATCH (a)-[:CALLS]->{1,3}(b) RETURN b"
    negative_fixtures:
      - "MATCH (a)-[:CALLS]->{0}(b) RETURN b"
    scope_note: "Bounded positive edge quantifiers with min > 0 and max >= min are represented; open-ended quantifiers and path modes such as trail, walk, simple, shortest, and related restrictions remain outside this slice."
    validation: "Parser, AST, sema, and IR bounded-quantifier vertical contract"

  - feature_id: gql-match
    priority: 130
    dependencies: [gql-node-patterns, gql-edge-patterns]
    clause_evidence_status: pending_licensed_clause
    iso_feature: MATCH_graph_pattern_query
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: partial
    positive_fixtures:
      - "MATCH (n) RETURN n"
      - "MATCH (a)-[:CALLS]->(b) WHERE a = 1 RETURN b"
    negative_fixtures:
      - "MATCH (a)-[:CALLS]->(b) RETURN"
      - "MATCH (a)-[:CALLS]->((b) RETURN a"
    scope_note: "One mandatory MATCH block lowers to graph IR; optional graphs are represented separately, while multiple mandatory blocks, graph selectors, path semantics, and complete query composition remain absent."
    validation: "gql compiler node-only and graph-filter vertical contracts"

  - feature_id: gql-optional-match
    priority: 140
    dependencies: [gql-match]
    clause_evidence_status: pending_licensed_clause
    iso_feature: OPTIONAL_MATCH
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: not_applicable
    positive_fixtures:
      - "MATCH (a) OPTIONAL MATCH (a)-[:CALLS]->(b) RETURN a, b"
    negative_fixtures:
      - "OPTIONAL MATCH (a) RETURN a"
    scope_note: "A mandatory MATCH followed by OPTIONAL MATCH is represented in AST and IR, and new optional bindings resolve in RETURN; outer-row preservation, nullability typing, and full optional pattern semantics remain deferred."
    validation: "Parser, AST, sema, and facade optional-match vertical contract"

  - feature_id: gql-where
    priority: 150
    dependencies: [gql-match, gql-expression-language]
    clause_evidence_status: pending_licensed_clause
    iso_feature: WHERE_predicates
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: partial
    positive_fixtures:
      - "MATCH (a)-[:CALLS]->(b) WHERE a = 1 RETURN b"
      - "MATCH (a)-[:CALLS]->(b) WHERE NOT (a != 1) RETURN b"
    negative_fixtures:
      - "MATCH (a)-[:CALLS]->(b) WHERE"
      - "MATCH (a)-[:CALLS]->(b) WHERE missing = 1 RETURN b"
    scope_note: "A small boolean and comparison expression subset exists; complete predicate, null, property, type, and value semantics are absent."
    validation: "gql-syntax, gql-ast, and gql-sema expression tests"

  - feature_id: gql-let
    priority: 160
    dependencies: [gql-lexical-identifiers, gql-expression-language]
    clause_evidence_status: pending_licensed_clause
    iso_feature: LET_bindings
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: not_applicable
    positive_fixtures:
      - "LET value = 1"
      - "MATCH (n) LET value = 1 RETURN n"
    negative_fixtures:
      - "LET = 1"
    scope_note: "Single simple bindings are lowered and checked; complete scope, value typing, shadowing, and query composition are absent."
    validation: "gql-ast and gql-sema LET tests"

  - feature_id: gql-return
    priority: 170
    dependencies: [gql-expression-language]
    clause_evidence_status: pending_licensed_clause
    iso_feature: RETURN_projection
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: not_applicable
    positive_fixtures:
      - "MATCH (n) RETURN 1"
      - "MATCH (n) RETURN n"
      - "MATCH (n) RETURN n AS person"
    negative_fixtures:
      - "MATCH (n) RETURN"
      - "MATCH (n) RETURN n AS"
      - "RETURN 1 AS value, 2 AS value"
    scope_note: "Simple name and literal projections plus explicit AS aliases are represented end to end; duplicate aliases are rejected. Star expansion, ordering, grouping, aggregate semantics, and the complete ISO projection model remain absent."
    validation: "gql-syntax alias lossless/recovery, gql-ast alias lowering, gql-sema alias IR and duplicate-alias diagnostics, and gql-compiler alias vertical contract"

  - feature_id: gql-query-composition
    priority: 180
    dependencies: [gql-return]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Query_composition_and_set_operations
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: not_applicable
    positive_fixtures:
      - "MATCH (a) RETURN a UNION MATCH (b) RETURN b"
    negative_fixtures:
      - "MATCH (a) RETURN a UNION"
      - "RETURN 1 UNION RETURN 2, 3"
      - "MATCH (a) RETURN a UNION RETURN a"
    scope_note: "Binary UNION is represented as independent graph-native QueryBlock branches with projection-arity validation and no binding leakage between branches. UNION ALL, NEXT, OTHERWISE, output-column compatibility beyond arity, ordering, and complete set-operation semantics remain absent."
    validation: "gql-syntax lossless UNION CST, gql-ast UNION boundary lowering, gql-sema branch IR/arity/scope diagnostics, gql-compiler vertical contract, and backend-neutral gql facade contract"

  - feature_id: gql-expression-language
    priority: 110
    dependencies: [gql-values-and-types]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Expressions_operators_and_predicates
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: not_applicable
    positive_fixtures:
      - "MATCH (n) WHERE n = 1 AND NOT (n != 2) RETURN n"
      - "LET value = 1 RETURN value"
      - "MATCH (n) RETURN 1 + 2 * 3"
      - "MATCH (n) RETURN 8 / 2 % 3"
      - "MATCH (n) RETURN CASE n.kind WHEN 'person' THEN 1 ELSE 0 END"
      - "MATCH (n) RETURN CASE WHEN n.score > 0 THEN CASE WHEN n.score > 10 THEN 2 ELSE 1 END ELSE 0 END"
    negative_fixtures:
      - "MATCH (n) RETURN TRUE + 1"
      - "MATCH (n) RETURN CASE WHEN 1 THEN 'invalid' END"
      - "MATCH (n) RETURN CASE WHEN TRUE 'missing then' END"
    scope_note: "Boolean/comparison precedence, bounded numeric arithmetic including division and modulo, and simple, searched, and nested CASE expressions are represented. Searched WHEN conditions are boolean-checked and simple CASE operands are compatibility-checked; function calls, general collection constructors, additional predicates, CASE result coercion beyond the current common-type model, and full null semantics remain absent."
    validation: "gql-syntax precedence and lossless CASE structure, gql-ast CASE lowering, sema numeric and CASE validation, canonical gql-ir CASE branches, and facade vertical contract"

  - feature_id: gql-property-and-label-expressions
    priority: 120
    dependencies: [gql-expression-language, gql-property-graph-model]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Property_access_label_tests_and_type_predicates
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: partial
    positive_fixtures:
      - "MATCH (n) WHERE n.name = TRUE RETURN n.name"
      - "MATCH (n:Person) RETURN n"
    negative_fixtures:
      - "MATCH (n) WHERE n.missing = RETURN n"
    scope_note: "Simple property access is represented through AST, sema, and IR; label expressions, type predicates, catalog-driven property typing, and null semantics remain absent."
    validation: "gql-syntax property structure, gql-ast property lowering, gql-sema typing, and gql frontend vertical contract"

  - feature_id: gql-grouping-aggregation-ordering
    priority: 190
    dependencies: [gql-return, gql-expression-language]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Grouping_aggregation_ordering_and_pagination
    normative_reference: ISO/IEC 39075:2024
    syntax_status: partial
    ast_status: partial
    sema_status: partial
    ir_status: partial
    catalog_status: not_applicable
    positive_fixtures:
      - "MATCH (n) RETURN n ORDER BY n.name LIMIT 10"
      - "MATCH (n) RETURN n LIMIT 10"
      - "MATCH (n) RETURN n ORDER BY n DESC, n.name ASC LIMIT 10"
      - "MATCH (n) RETURN n ORDER BY n LIMIT 10 OFFSET 2"
    negative_fixtures:
      - "MATCH (n) RETURN count("
      - "MATCH (n) RETURN n LIMIT"
      - "MATCH (n) RETURN n LIMIT 0"
      - "MATCH (n) RETURN n OFFSET 2"
      - "MATCH (n) RETURN n LIMIT 10 OFFSET"
    scope_note: "Branch-local positive integer LIMIT, non-negative integer OFFSET constrained to LIMIT, and expression ORDER BY keys with ASC/DESC direction are represented through lossless CST, AST, semantic validation, and canonical IR. Aggregates, GROUP BY, HAVING, expression limits or offsets, output-name ordering, and complete pagination semantics remain absent."
    validation: "gql-syntax pagination and ORDER BY lossless/recovery, gql-ast lowering, gql-sema branch-local IR and invalid-clause diagnostics, gql-compiler vertical contracts, and backend-neutral gql facade contracts"

  - feature_id: gql-graph-modification
    priority: 200
    dependencies: [gql-match, gql-values-and-types]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Graph_modification_statements
    normative_reference: ISO/IEC 39075:2024
    syntax_status: not_implemented
    ast_status: not_implemented
    sema_status: not_implemented
    ir_status: not_implemented
    catalog_status: not_applicable
    positive_fixtures:
      - "INSERT (n:Person {name: 'Ada'})"
      - "MATCH (n) DELETE n"
    negative_fixtures:
      - "INSERT"
    scope_note: "The lexer reserves several modification words, but no modification AST, semantic model, or graph update IR exists."
    validation: "Gap entry; lexer reservation is not implementation evidence"

  - feature_id: gql-catalog-management
    priority: 210
    dependencies: [gql-catalog-and-schema-model]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Catalog_schema_and_graph_management_statements
    normative_reference: ISO/IEC 39075:2024
    syntax_status: not_implemented
    ast_status: not_implemented
    sema_status: not_implemented
    ir_status: not_implemented
    catalog_status: partial
    positive_fixtures:
      - "CREATE GRAPH social"
      - "DROP GRAPH social"
    negative_fixtures:
      - "CREATE GRAPH"
    scope_note: "Rust catalog declarations exist, but GQL management statements and their execution semantics do not."
    validation: "Gap entry; catalog API is not a statement implementation"

  - feature_id: gql-procedures-and-call
    priority: 220
    dependencies: [gql-catalog-and-schema-model, gql-expression-language]
    clause_evidence_status: pending_licensed_clause
    iso_feature: Procedure_invocation
    normative_reference: ISO/IEC 39075:2024
    syntax_status: not_implemented
    ast_status: not_implemented
    sema_status: not_implemented
    ir_status: not_implemented
    catalog_status: partial
    positive_fixtures:
      - "CALL db.labels()"
    negative_fixtures:
      - "CALL"
    scope_note: "Procedure signatures are stored in the catalog API, but CALL syntax, argument typing, and invocation IR are absent."
    validation: "Gap entry; catalog procedure declarations are not invocation support"

  - feature_id: gql-session-and-control
    priority: 230
    dependencies: []
    clause_evidence_status: pending_licensed_clause
    iso_feature: Session_transaction_and_control_statements
    normative_reference: ISO/IEC 39075:2024
    syntax_status: not_implemented
    ast_status: not_implemented
    sema_status: not_implemented
