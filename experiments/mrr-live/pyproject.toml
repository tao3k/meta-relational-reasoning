[project]
name = "mrr-live"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mrr-live = "mrr_live.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/mrr_live"]
