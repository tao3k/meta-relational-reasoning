[package]
name = "mrr-temporal-physical-roundtrip"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0 AND LGPL-2.1-or-later"
[workspace]
[workspace.package]
license = "Apache-2.0 AND LGPL-2.1-or-later"
[dependencies]
mrr-runtime = { path = "../..", features = ["mrr-transport", "data-publication"] }
meta-relational-reasoning = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "68ffa47d65f6dc92a653377992d28df0376c5ea8", default-features = false }
mrr-property-source = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "68ffa47d65f6dc92a653377992d28df0376c5ea8" }
mrr-data-core = { git = "https://github.com/tao3k/mrr-data.git", rev = "db26a0f592b492ff3dbc9970b26182ce73b8b89d", features = ["content-identity"] }
mrr-data-content = { git = "https://github.com/tao3k/mrr-data.git", rev = "db26a0f592b492ff3dbc9970b26182ce73b8b89d", features = ["snapshot"] }
mrr-data-datafusion = { git = "https://github.com/tao3k/mrr-data.git", rev = "db26a0f592b492ff3dbc9970b26182ce73b8b89d" }
mrr-data-backend = { git = "https://github.com/tao3k/mrr-data.git", rev = "db26a0f592b492ff3dbc9970b26182ce73b8b89d", features = ["turso"] }
tempfile = "3"
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
arrow-ipc = "58.4.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt", "macros"] }

# Match the physical owner's qualified test build; preserve native integer precision.
[profile.dev]
opt-level = 2
codegen-units = 16
debug = false

[build-dependencies]
toml = "0.9.12"
