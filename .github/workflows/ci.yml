name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo test -p gql --no-default-features
      - run: cargo test -p gql --all-features
      - name: Project policy and publish-readiness gate
        run: cargo run -p xtask -- verify
      - name: Core dependency purity
        shell: bash
        run: |
          tree="$(cargo tree -p gql-core)"
          if grep -Eq '(^| )gql-ascent |(^| )ascent ' <<<"$tree"; then
            printf '%s\n' "$tree"
            exit 1
          fi
      - name: Publish dry-run sanity
        run: |
          for pkg in gql-core gql-ast gql-syntax gql-source gql-types gql-ir gql-sema gql-compiler gql-catalog gql-ascent gql; do
            cargo package --package "$pkg" --allow-dirty --no-verify
          done
