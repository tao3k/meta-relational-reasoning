name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_deepseek_live:
        description: Run the paid DeepSeek MRR live gate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Native Gerbil and Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      GERBIL_REF: add922481cec81d05431db014bcb91b30485cf21
      GERBIL_PREFIX: ${{ github.workspace }}/.ci/gerbil
      GERBIL_SRC: ${{ github.workspace }}/.ci/gerbil-src
      GERBIL_BUILD_VERBOSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev libssl-dev pkg-config zlib1g-dev

      - name: Install macOS Gerbil
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install tao3k/gerbil/gerbil-scheme
          openssl_prefix="$(brew --prefix openssl@3)"
          echo "CPPFLAGS=-I$openssl_prefix/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$openssl_prefix/lib" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$openssl_prefix/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Restore Linux Gerbil
        if: runner.os == 'Linux'
        id: gerbil-cache
        uses: actions/cache@v4
        with:
          path: .ci/gerbil
          key: gerbil-${{ runner.os }}-${{ runner.arch }}-${{ env.GERBIL_REF }}

      - name: Build Linux Gerbil
        if: runner.os == 'Linux' && steps.gerbil-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://git.cons.io/mighty-gerbils/gerbil "$GERBIL_SRC"
          cd "$GERBIL_SRC"
          git checkout "$GERBIL_REF"
          ./configure --prefix="$GERBIL_PREFIX" --enable-march=
          . ./build-env.sh
          for target in prepare gambit boot-gxi stage0 stage1 stdlib libgerbil lang r7rs-large srfi tools; do
            ./src/build.sh "$target"
          done
          ./install.sh

      - name: Activate Gerbil
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo "$GERBIL_PREFIX/bin" >> "$GITHUB_PATH"
            export PATH="$GERBIL_PREFIX/bin:$PATH"
            gerbil_gsc="$GERBIL_PREFIX/bin/gsc"
          else
            gerbil_gsc="$(brew list gerbil-scheme | awk '/\/bin\/gsc$/ { print; exit }')"
          fi
          test -x "$gerbil_gsc"
          echo "GERBIL_GSC=$gerbil_gsc" >> "$GITHUB_ENV"
          cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"
          echo "GERBIL_BUILD_CORES=$cores" >> "$GITHUB_ENV"
          gerbil --version
          "$gerbil_gsc" -v

      - name: Restore Gerbil package graph
        uses: actions/cache@v4
        with:
          path: .gerbil
          key: gxpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gerbil.pkg') }}

      - name: Install declared Gerbil dependencies
        run: gerbil deps --install

      - name: Build declared Gerbil package
        run: gerbil build

      - name: Test Gerbil package
        run: gerbil test

      - name: Test Rust workspace in the Gerbil package environment
        run: gerbil env cargo test --workspace --locked

      - name: Lint Rust workspace
        run: gerbil env cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check lightweight GQL support profiles
        run: |
          gerbil env cargo check -p gql-syntax --no-default-features --locked
          gerbil env cargo check -p gql-ast --no-default-features --locked

      - name: Test Python evidence projects
        run: |
          uv --project proofs/MRRProof run pytest -q proofs/MRRProof/tests
          uv --project experiments/mrr-live run pytest -q experiments/mrr-live/tests

  deepseek-live:
    if: github.event_name == 'workflow_dispatch' && inputs.run_deepseek_live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: DeepSeek MRR live smoke
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv --project experiments/mrr-live run mrr-live
