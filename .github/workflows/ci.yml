name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo test -p gql --no-default-features
      - run: cargo test -p gql --all-features
      - name: Core dependency purity
        shell: bash
        run: |
          if grep -Eq 'default = \["ascent"\]' crates/gql/Cargo.toml; then
            echo "gql default features should remain backend-neutral (no implicit ascent)."
            exit 1
          fi
          forbidden="gql-ascent|ascent"
          for crate in gql-core gql-ast gql-compiler gql-catalog gql-ir gql-sema gql-syntax gql-source gql-types; do
            tree="$(cargo tree -p "$crate" --all-features)"
            if grep -Eq "([[:space:]]|^)(${forbidden})([[:space:]@]|$)" <<<"$tree"; then
              printf '%s\n' "$crate depends on forbidden backend crate ${forbidden}"
              printf '%s\n' "$tree"
              exit 1
            fi
          done
      - name: Frontend authority and catalog contract
        shell: bash
        run: |
          test ! -e crates/gql-syntax/src/rowan_build.rs
          if rg -n 'SyntaxNode::new\(|rowan_build|source\.get|edge_direction_from_span|raw\.trim' crates/gql-syntax crates/gql-ast; then
            echo "frontend must use the direct lossless Rowan tree and typed views."
            exit 1
          fi
          if rg -n 'RelationName|PredicateDescriptor|RelationIdentity|RelationAuthority' crates/gql-catalog/src; then
            echo "gql-catalog must not own reasoning relation concepts."
            exit 1
          fi
          grep -Fxq 'default = []' crates/gql/Cargo.toml
          grep -Fq 'gql-catalog ISO catalog declarations only' ARCHITECTURE.md
          grep -Fq 'quality_capabilities:' iso-gql-feature-ledger.yaml
      - name: Publish dry-run sanity
        run: |
          echo "Publish readiness is intentionally excluded in this phase."
          echo "Reason: the workspace crates remain workspace-local and cross-dependent (including local harness policy support), so publish dry-runs are not the correct signal until release packaging topology is established."
