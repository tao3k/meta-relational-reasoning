name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_deepseek_live:
        description: Run the paid DeepSeek MRR live gate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHONPATH: proofs/MRRProof/src

jobs:
  certified-transformations:
    name: Certified finite transformations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/MRRProof/AgenticAIContextRust
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Qualify finite native tables, actual kernel, corpus and publication
        run: cargo test -p meta-relational-reasoning -p mrr-identity --lib --no-default-features --locked
      - name: Lint finite facade and executable publication example
        run: cargo clippy -p meta-relational-reasoning -p mrr-identity --all-targets --no-default-features --locked -- -D warnings
      - name: Execute durable finite workflow
        run: cargo run -p meta-relational-reasoning --no-default-features --locked --example finite_transformation -- "$RUNNER_TEMP/finite-result.cbor"

  test:
    name: Native Gerbil and Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      GERBIL_PREFIX: ${{ github.workspace }}/.ci/gerbil
      GERBIL_BUILD_VERBOSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/MRRProof/AgenticAIContextRust
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: typst-community/setup-typst@v4

      - name: Install documentation proof dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install --global @mermaid-js/mermaid-cli@11.12.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev libssl-dev pkg-config zlib1g-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install gcc jq openssl pkg-config sqlite zlib
          openssl_prefix="$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl)"
          macos_major="$(sw_vers -productVersion | cut -d. -f1)"
          echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$macos_major.0" >> "$GITHUB_ENV"
          # Keep macOS linker invocations serial after repeated clang Bus error: 10 failures.
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          # Apple ld has also crashed in serial native links. Use Rust's Mach-O LLD.
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          rust_macho_linker="$(rustc --print sysroot)/lib/rustlib/$rust_host/bin/gcc-ld/ld64.lld"
          test -x "$rust_macho_linker"
          "$rust_macho_linker" --version
          echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=-fuse-ld=$rust_macho_linker" >> "$GITHUB_ENV"

      - name: Install immutable Gerbil release
        shell: bash
        run: .github/scripts/install-gerbil-release.sh "$GERBIL_PREFIX"

      - name: Activate Gerbil build controls
        shell: bash
        run: |
          test -x "$GERBIL_PREFIX/bin/gsc"
          echo "GERBIL_GSC=$GERBIL_PREFIX/bin/gsc" >> "$GITHUB_ENV"
          cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"
          echo "GERBIL_BUILD_CORES=$cores" >> "$GITHUB_ENV"
          gerbil --version
          "$GERBIL_PREFIX/bin/gsc" -v

      - name: Restore Gerbil package graph
        uses: actions/cache@v4
        with:
          path: .gerbil
          key: gxpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gerbil.pkg', '.github/scripts/install-gerbil-release.sh') }}

      - name: Prefetch declared native commit objects
        run: python3 -m mrr_proof_validation.prepare_gerbil_dependencies

      - name: Install declared Gerbil dependencies
        run: gerbil deps --install

      - name: Build declared Gerbil package
        run: gerbil build

      - name: Verify native qualification rejects false success
        run: |
          uv --project proofs/MRRProof run pytest -q proofs/MRRProof/tests/test_native_tests.py
          gerbil env python3 -m mrr_proof_validation.native_tests self-test

      - name: Test Gerbil package
        run: gerbil env python3 -m mrr_proof_validation.native_tests scheme

      - name: Test Rust workspace in the Gerbil package environment
        env:
          MRR_NATIVE_PROGRESS: "1"
        run: gerbil env cargo test --workspace --locked

      - name: Test optional Context feature boundaries
        run: |
          gerbil env python3 -m mrr_proof_validation.context_features
          gerbil env python3 -m mrr_proof_validation.context_qualify matrix

      - name: Qualify complete Query Context workflow and scale
        run: |
          gerbil env cargo build -p meta-relational-reasoning --examples --features agentic-ai-context-tokens --locked
          gerbil env python3 -m mrr_proof_validation.context_qualify workflow
          gerbil env python3 -m mrr_proof_validation.context_scale --output .ci/context-scale

      - name: Save Context scale receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-scale-${{ matrix.os }}-${{ github.event_name }}
          path: .ci/context-scale/*.json
          if-no-files-found: ignore

      - name: Lint optional Context features
        run: gerbil env cargo clippy -p mrr-agentic-ai-context -p meta-relational-reasoning --all-targets --all-features --locked -- -D warnings

      - name: Test source-bound property query integration
        run: |
          gerbil env cargo build -p mrr-gerbil --bin mrr-native-worker --locked
          gerbil env cargo test -p mrr-property-source --features native-inference --locked

      - name: Lint Rust workspace
        run: gerbil env cargo clippy --all-targets --locked -- -D warnings

      - name: Lint source-bound property query integration
        run: gerbil env cargo clippy -p mrr-property-source --all-targets --locked -- -D warnings

      - name: Test Python evidence projects
        run: |
          uv --project proofs/MRRProof run pytest -q proofs/MRRProof/tests
          uv --project experiments/mrr-live run pytest -q experiments/mrr-live/tests

  agentic-ai-context-source-proof:
    name: Agentic AI Context Rust source proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-17
          components: rustc-dev,rust-src
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/MRRProof/AgenticAIContextRust
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Download pinned official extractor
        run: |
          mkdir -p .ci/aeneas
          curl --fail --location --retry 3 https://github.com/AeneasVerif/aeneas/releases/download/nightly-2026.10.03-557eff8/aeneas-linux-x86_64.tar.gz -o .ci/aeneas.tar.gz
          echo 'e2ee0933cba4aa51f811ec7a0d1e99d2b345412875b1973dea16399c90c5f01f  .ci/aeneas.tar.gz' | sha256sum --check
          tar -xzf .ci/aeneas.tar.gz -C .ci/aeneas
      - name: Regenerate current Rust evidence, identities and driver
        run: |
          cargo fetch --locked
          python3 -m mrr_proof_validation.context_source_proof --toolchain-dir .ci/aeneas --receipt .ci/context-source-proof.json
          python3 -m mrr_proof_validation.context_source_proof --value-equality --toolchain-dir .ci/aeneas --receipt .ci/value-source-proof.json
      - name: Prepare pinned Lean source proof dependencies
        working-directory: proofs/MRRProof/AgenticAIContextRust
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: |
          lake update
          modules=$(rg --no-filename '^(public )?import Mathlib' .lake/packages/aeneas/backends/lean/Aeneas .lake/packages/aeneas/backends/lean/AeneasMeta NativeFacts.lean -g '*.lean' | sed -E 's/^(public )?import ([A-Za-z0-9_.]+).*/\2/' | sort -u)
          lake exe cache get $modules
          cd ../AgenticAIContextValue
          lake update
          lake exe cache get $modules
      - name: Prove generated production functions and audit axioms
        working-directory: proofs/MRRProof/AgenticAIContextRust
        run: |
          lake build Evidence Driver NativeFacts Stack Expansion Forward Reverse ReverseIndex ImpactWrapper Coverage Rejection ForwardWrapper GeneralForward GeneralWrapper DeclaredForward RevisionProjection BindingEquality
          lake env lean Axioms.lean
          cd ../AgenticAIContextValue
          lake build ValueEquality
          lake env lean Axioms.lean
      - name: Save current source extraction receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-source-proof-${{ github.event_name }}
          path: |
            .ci/context-source-proof.json
            .ci/value-source-proof.json
          if-no-files-found: error

  agentic-ai-context-tla:
    name: Agentic AI Context TLA and Lean conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare pinned official TLC
        run: |
          mkdir -p .ci/tla
          curl --fail --location --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o .ci/tla/tla2tools.jar
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  .ci/tla/tla2tools.jar' | sha256sum --check
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/MRRProof/AgenticAIContext
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Build Lean publication laws and actual TLC-state replay
        working-directory: proofs/MRRProof/AgenticAIContext
        run: |
          python3 ../src/mrr_proof_validation/lean_dependency_pin.py .
          lake build MRR agentic-ai-context-tla-replay
          lake env lean Checks/Axioms.lean
      - name: Check safety, liveness, counterexamples and Lean state conformance
        run: |
          python3 -m mrr_proof_validation.context_tla --tlc-jar .ci/tla/tla2tools.jar --lean-replay proofs/MRRProof/AgenticAIContext/.lake/build/bin/agentic-ai-context-tla-replay --receipt .ci/tla/receipt.json
          python3 -m mrr_proof_validation.meta_impact_tla --tlc-jar .ci/tla/tla2tools.jar --receipt .ci/tla/meta-impact-receipt.json
      - name: Save TLA receipt and actual TLC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-tla-${{ github.event_name }}
          path: |
            .ci/tla/*.json
            .ci/tla/*.log
          if-no-files-found: error

  agentic-ai-context-proof:
    name: Agentic AI Context proofs and shared C4 replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/MRRProof/AgenticAIContext
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Build kernel proofs
        working-directory: proofs/MRRProof/AgenticAIContext
        run: |
          python3 ../src/mrr_proof_validation/lean_dependency_pin.py .
          lake build MRR agentic-ai-context-refinement
      - name: Replay actual C4 and shared Rust fixture
        working-directory: proofs/MRRProof/AgenticAIContext
        run: lake env lean --run Checks/Main.lean
      - name: Build actual Rust Context refinement producer
        run: cargo build -p meta-relational-reasoning --example context_refinement --no-default-features --features agentic-ai-context-tokens --locked
      - name: Compare actual Rust algorithms and CBOR hashes with Lean
        run: python3 -m mrr_proof_validation.context_refinement --receipt .ci/context-refinement.json
      - name: Save actual Rust refinement receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-refinement-${{ github.event_name }}
          path: .ci/context-refinement.json
          if-no-files-found: error
      - name: Audit all Context declarations for axioms
        working-directory: proofs/MRRProof/AgenticAIContext
        run: lake env lean Checks/Axioms.lean

  deepseek-live:
    if: github.event_name == 'workflow_dispatch' && inputs.run_deepseek_live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: DeepSeek MRR live smoke
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv --project experiments/mrr-live run mrr-live
