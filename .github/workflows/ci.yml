name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p gql --no-default-features
      - run: cargo test -p gql --all-features
      - name: Core dependency purity
        shell: bash
        run: |
          if ! grep -Eq '^default = \["ascent"\]$' crates/gql/Cargo.toml; then
            echo "gql facade must enable the optional Ascent backend by default."
            exit 1
          fi
          forbidden="gql-ascent|ascent"
          for crate in gql-core gql-ast gql-compiler gql-catalog gql-ir gql-sema gql-syntax gql-source gql-types; do
            tree="$(cargo tree -p "$crate" --all-features)"
            if grep -Eq "([[:space:]]|^)(${forbidden})([[:space:]@]|$)" <<<"$tree"; then
              printf '%s\n' "$crate depends on forbidden backend crate ${forbidden}"
              printf '%s\n' "$tree"
              exit 1
            fi
          done
      - name: Frontend feature-invariance contracts
        run: |
          cargo test -p gql frontend_contract
          cargo test -p gql --no-default-features frontend_contract
      - name: Publish dry-run sanity
        run: |
          echo "Publish readiness is intentionally excluded in this phase."
          echo "Reason: every publishable workspace crate keeps the mandatory, unpublished harness policy in dev-dependencies, so Cargo package resolution cannot construct an uploadable crate without removing required policy enforcement."
