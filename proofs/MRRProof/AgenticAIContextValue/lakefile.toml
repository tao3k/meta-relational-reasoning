[[lean_lib]]
name = "ValueGenerated"

[[lean_lib]]
name = "ValueEquality"

[[lean_lib]]
name = "ValueLoops"

[[lean_lib]]
name = "ValueRecursive"

[[lean_lib]]
name = "FactEquality"
