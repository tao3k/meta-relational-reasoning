[project]
name = "mrr-proof-validation"
version = "0.1.0"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
mrr-proof-impact = "mrr_proof_validation.cli:impact_main"
mrr-lean-validate = "mrr_proof_validation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/mrr_proof_validation"]
