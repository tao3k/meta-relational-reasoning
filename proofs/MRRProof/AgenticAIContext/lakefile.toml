name = "MRRAgenticAIContextProofs"
version = "0.1.0"
defaultTargets = ["MRR"]
moreLeanArgs = ["-DautoImplicit=false", "-DwarningAsError=true"]

[[require]]
name = "LeanPoo"
git = "https://github.com/tao3k/lean-poo.git"
rev = "2abf644bb4a10871345b1e6c38f5a75f607d43b5"

[[lean_lib]]
name = "MRR"

[[lean_exe]]
name = "agentic-ai-context-check"
root = "Checks.Main"

[[lean_exe]]
name = "agentic-ai-context-refinement"
root = "Checks.Refinement"

[[lean_exe]]
name = "agentic-ai-context-quint-replay"
root = "Checks.QuintReplay"
