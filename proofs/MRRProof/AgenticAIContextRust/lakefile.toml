name = "MRRContextRustProofs"
version = "0.1.0"
defaultTargets = ["Evidence", "Driver", "NativeFacts", "Stack", "Expansion", "Forward", "Reverse"]
moreLeanArgs = ["-DautoImplicit=false", "-DwarningAsError=true"]

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
subDir = "backends/lean"
rev = "557eff83ecef5083b98a52a94ca7fae63d6c1dab"

[[lean_lib]]
name = "Generated"

[[lean_lib]]
name = "Evidence"

[[lean_lib]]
name = "MRR"
srcDir = "../AgenticAIContext"
roots = ["MRR.AgenticAIContext.Closure", "MRR.AgenticAIContext.Worklist", "MRR.AgenticAIContext.Termination", "MRR.AgenticAIContext.Scheduled"]

[[lean_lib]]
name = "Driver"

[[lean_lib]]
name = "NativeFacts"

[[lean_lib]]
name = "Stack"

[[lean_lib]]
name = "Expansion"

[[lean_lib]]
name = "Forward"

[[lean_lib]]
name = "Reverse"
