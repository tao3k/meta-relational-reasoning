[workspace]
members = [
  "build-support/mrr-asp-rust-project-policy",
  "build-support/mrr-gerbil-native-build",
  "crates/*",
]
default-members = [
  "build-support/mrr-asp-rust-project-policy",
  "build-support/mrr-gerbil-native-build",
  "crates/meta-relational-reasoning",
  "crates/mrr-ascent",
  "crates/mrr-bundle",
  "crates/mrr-conformance",
  "crates/mrr-frontends",
  "crates/mrr-gerbil",
  "crates/mrr-identity",
  "crates/mrr-intent",
  "crates/mrr-lineage",
  "crates/mrr-logic",
  "crates/mrr-query",
  "crates/mrr-relation",
  "crates/mrr-revision",
  "crates/mrr-search",
  "crates/mrr-transition",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/tao3k/meta-relational-reasoning"

[workspace.dependencies]
blake3 = "1.8"
ascent = "0.8.0"
asp-rust-build-support = { git = "https://github.com/tao3k/asp-rust", rev = "2419414ee5379bad89506496e3eaab928df68daf", version = "0.1.0" }
criterion = "0.8.2"
gerbil-scheme-sys = { git = "https://github.com/tao3k/gerbil-scheme-rust.git", rev = "b3eb5dce9bfb1e57c3ce618de46798e360213f6a", features = ["external-program"] }
gerbil-scheme-native-build = { git = "https://github.com/tao3k/gerbil-scheme-rust.git", rev = "b3eb5dce9bfb1e57c3ce618de46798e360213f6a" }
icu_properties = "2.2.0"
mrr-asp-rust-build-support = { path = "build-support/mrr-asp-rust-project-policy", version = "0.1.0" }
mrr-identity = { path = "crates/mrr-identity", version = "0.1.0" }
mrr-intent = { path = "crates/mrr-intent", version = "0.1.0" }
mrr-relation = { path = "crates/mrr-relation", version = "0.1.0" }
mrr-revision = { path = "crates/mrr-revision", version = "0.1.0" }
mrr-search = { path = "crates/mrr-search", version = "0.1.0" }
mrr-query = { path = "crates/mrr-query", version = "0.1.0" }
mrr-frontends = { path = "crates/mrr-frontends", version = "0.1.0" }
mrr-logic = { path = "crates/mrr-logic", version = "0.1.0" }
mrr-conformance = { path = "crates/mrr-conformance", version = "0.1.0" }
mrr-lineage = { path = "crates/mrr-lineage", version = "0.1.0" }
mrr-transition = { path = "crates/mrr-transition", version = "0.1.0" }
mrr-bundle = { path = "crates/mrr-bundle", version = "0.1.0" }
mrr-ascent = { path = "crates/mrr-ascent", version = "0.1.0" }
mrr-gerbil = { path = "crates/mrr-gerbil", version = "0.1.0" }
mrr-gerbil-native-build = { path = "build-support/mrr-gerbil-native-build", version = "0.1.0" }
meta-relational-reasoning = { path = "crates/meta-relational-reasoning", version = "0.1.0" }
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
rowan = "0.16.1"

[workspace.lints.rust]
unsafe_code = "forbid"


[profile.dev]
incremental = true
opt-level = "s"
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
opt-level = "s"
debug = false
